<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canon Scanner Advisor | Choice of Language</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --canon-red: #ED1C24;
            --canon-dark: #1a1a1a;
            --canon-gray: #f8f9fa;
        }
        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--canon-dark);
            margin: 0;
            overflow: hidden;
        }
        .hero-bg {
            background: radial-gradient(circle at 50% 50%, #ffffff 0%, #f3f4f6 100%);
        }
        .main-container {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .lang-zone {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .lang-zone:hover {
            background: rgba(255, 255, 255, 0.9);
        }
        .lang-zone::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--canon-red);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }
        .lang-zone:hover::after {
            transform: scaleX(1);
        }
        .bg-text {
            position: absolute;
            font-size: 12rem;
            font-weight: 900;
            opacity: 0.03;
            pointer-events: none;
            line-height: 1;
            z-index: 0;
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col hero-bg">

    <!-- Top Branding Bar: Strict White Background -->
    <header class="w-full py-8 flex justify-center items-center bg-white border-b border-gray-100 z-10">
        <img src="https://i.ibb.co/YBMsYnYj/Canon-Logo-2.png" alt="Canon" class="h-10 md:h-12 w-auto">
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-6 md:p-12 relative">
        
        <div class="text-center mb-12 fade-in">
            <p class="text-[10px] font-black uppercase tracking-[0.4em] text-red-600 mb-2">imageFORMULA Solutions</p>
            <h1 class="text-3xl md:text-5xl font-black text-gray-900 tracking-tighter">
                Scanner Advisor <span class="font-light text-gray-400">Hub</span>
            </h1>
        </div>

        <!-- Modern Split Language Selector -->
        <div class="main-container w-full max-w-5xl rounded-[3rem] shadow-2xl overflow-hidden flex flex-col md:flex-row fade-in" style="animation-delay: 0.2s;">
            
            <!-- English Side -->
            <a href="advisorEN.html" class="lang-zone flex-1 p-12 md:p-20 flex flex-col items-center justify-center text-center border-b md:border-b-0 md:border-r border-gray-100 group">
                <span class="bg-text -left-4 -top-4 group-hover:scale-110 transition-transform duration-700">EN</span>
                <div class="z-10">
                    <h2 class="text-4xl font-black mb-4 tracking-tight group-hover:text-red-600 transition-colors">English</h2>
                    <p class="text-gray-500 font-medium max-w-[200px] leading-relaxed">
                        Discover the ideal capture workflow for your business.
                    </p>
                    <div class="mt-8 w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center group-hover:bg-red-600 group-hover:border-red-600 transition-all duration-300">
                        <svg class="w-5 h-5 text-gray-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </div>
                </div>
            </a>

            <!-- French Side -->
            <a href="advisorFR.html" class="lang-zone flex-1 p-12 md:p-20 flex flex-col items-center justify-center text-center group">
                <span class="bg-text -right-4 -bottom-4 group-hover:scale-110 transition-transform duration-700">FR</span>
                <div class="z-10">
                    <h2 class="text-4xl font-black mb-4 tracking-tight group-hover:text-red-600 transition-colors">Français</h2>
                    <p class="text-gray-500 font-medium max-w-[200px] leading-relaxed">
                        Trouvez la solution de numérisation adaptée à vos besoins.
                    </p>
                    <div class="mt-8 w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center group-hover:bg-red-600 group-hover:border-red-600 transition-all duration-300">
                        <svg class="w-5 h-5 text-gray-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </div>
                </div>
            </a>

        </div>

    </main>

    <!-- Global Footer -->
    <footer class="w-full py-10 bg-white border-t border-gray-50 flex flex-col items-center justify-center">
        <img src="https://i.ibb.co/svcfqT91/image-FORMULA2.png" alt="imageFORMULA" class="h-6 opacity-40 mb-4 grayscale">
        <p class="text-[9px] text-gray-400 font-bold uppercase tracking-[0.3em]">
            &copy; 2026 Canon Canada Inc. All Rights Reserved.
        </p>
    </footer>

</body>
</html>
