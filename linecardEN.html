<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canon | Product Line Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --canon-red: #ED1C24;
            --canon-dark: #1a1a1a;
            --canon-gray: #f8f9fa;
        }
        body {
            background-color: var(--canon-gray);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--canon-dark);
            margin: 0;
            background-image: radial-gradient(#d1d5db 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .product-mini-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .product-mini-card:hover {
            transform: translateY(-5px);
            border-color: var(--canon-red);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .conn-icon { opacity: 0.2; filter: grayscale(1); }
        .conn-icon.active { opacity: 1; filter: none; color: var(--canon-red); }
    </style>
</head>

                    Back to Hub
                </a>
            </div>
            
            <div class="flex items-center gap-4 md:gap-10">
                <img src="https://i.ibb.co/svcfqT91/image-FORMULA2.png" alt="imageFORMULA" class="hidden sm:block h-6 md:h-8 w-auto opacity-80">
                
                <div class="flex items-center gap-3 text-[10px] font-black uppercase tracking-[0.2em] border-l border-gray-200 pl-4 md:pl-10 text-right">
                    <span class="text-gray-400">Language:</span>
