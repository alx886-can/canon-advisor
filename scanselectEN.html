<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canon | Scan Selector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --canon-red: #ED1C24;
            --canon-dark: #1a1a1a;
            --canon-gray: #f8f9fa;
        }
        body {
            background-color: var(--canon-gray);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--canon-dark);
            margin: 0;
            background-image: radial-gradient(#d1d5db 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .product-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--canon-red);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
        .filter-checkbox:checked {
            background-color: var(--canon-red);
            border-color: var(--canon-red);
        }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full py-6 flex justify-center items-center bg-white border-b border-gray-100 shadow-sm sticky top-0 z-50">
        <div class="w-full max-w-7xl px-6 flex justify-between items-center">
            <div class="flex items-center gap-8">
                <a href="index.html"><img src="https://i.ibb.co/YBMsYnYj/Canon-Logo-2.png" alt="Canon" class="h-8 w-auto"></a>
                <a href="selectorEN.html" class="hidden md:flex items-center text-xs font-bold text-gray-400 uppercase tracking-widest hover:text-red-600 transition-colors">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"></path></svg>
                    Back to Hub
                </a>
            </div>
            <img src="https://i.ibb.co/svcfqT91/image-FORMULA2.png" alt="imageFORMULA" class="h-6 w-auto opacity-70">
        </div>
    </header>

    <main class="w-full max-w-7xl px-6 py-10 mx-auto flex flex-col lg:flex-row gap-8 flex-grow">
        
        <!-- Sidebar Filters -->
        <aside class="w-full lg:w-72 space-y-6 shrink-0">
            <div class="glass-panel p-6 rounded-[2rem] sticky top-28 shadow-sm">
                <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                    <h2 class="text-xs font-black uppercase tracking-widest">Filters</h2>
                    <button id="resetFilters" class="text-[10px] font-bold text-red-600 hover:underline uppercase">Clear All</button>
                </div>

                <!-- Category Filter -->
                <div class="mb-8">
                    <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4">Category</h3>
                    <div class="space-y-3" id="categoryFilters">
                        <!-- JS Injected -->
                    </div>
                </div>

                <!-- Connectivity Filter -->
                <div class="mb-8">
                    <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4">Connectivity</h3>
                    <div class="space-y-3" id="connectivityFilters">
                        <!-- JS Injected -->
                    </div>
                </div>

                <!-- Paper Size Filter -->
                <div class="mb-8">
                    <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4">Max Paper Size</h3>
                    <div class="space-y-3" id="sizeFilters">
                        <!-- JS Injected -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- Product Grid -->
        <div class="flex-grow">
            <div class="mb-10 fade-in text-left">
                <h1 class="text-3xl md:text-5xl font-black text-gray-900 tracking-tighter mb-4 uppercase">
                    Scan <span class="text-[#ED1C24]">Selector</span>
                </h1>
                <p class="text-gray-500 font-medium text-lg max-w-2xl">
                    Browse the complete imageFORMULA lineup. Use the filters to refine by technical requirements.
                </p>
            </div>

            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6 fade-in" style="animation-delay: 0.1s;">
                <!-- Products Injected Here -->
            </div>
            
            <div id="noResults" class="hidden py-20 text-center bg-white/40 rounded-[3rem] border border-gray-200 fade-in">
                <p class="text-gray-400 font-bold italic">No scanners match the selected criteria. Try adjusting your filters.</p>
            </div>
        </div>
    </main>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal-overlay fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] shadow-2xl max-w-4xl w-full p-8 md:p-12 relative overflow-y-auto max-h-[90vh]">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-gray-400 hover:text-gray-800 transition-colors focus:outline-none">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div id="modalContent"></div>
        </div>
    </div>

    <footer class="w-full py-10 bg-white border-t border-gray-100 flex flex-col items-center justify-center mt-auto">
        <p class="text-[9px] text-gray-400 font-bold uppercase tracking-[0.3em]">
            &copy; 2026 Canon Canada Inc. All Rights Reserved.
        </p>
    </footer>

    <script>
        let allProducts = [];
        let activeFilters = {
            category: [],
            connectivity: [],
            max_size: []
        };

        async function init() {
            try {
                const response = await fetch('advisor.json');
                const data = await response.json();
                allProducts = data.products;
                
                generateFilterOptions();
                renderProducts();
            } catch (error) {
                console.error("Error loading advisor.json:", error);
                document.getElementById('productGrid').innerHTML = `
                    <div class="col-span-full text-center py-10 bg-red-50 rounded-3xl border border-red-200">
                        <p class="text-red-600 font-bold">Error loading database. Please ensure advisor.json is in your root folder.</p>
                    </div>`;
            }
        }

        function generateFilterOptions() {
            const categories = [...new Set(allProducts.map(p => p.category))].sort();
            const sizes = [...new Set(allProducts.map(p => p.specs.max_size))].sort();
            
            // Extract unique connectivity options from arrays
            let connections = new Set();
            allProducts.forEach(p => p.specs.connectivity.forEach(c => connections.add(c)));
            connections = [...connections].sort();

            const createCheckbox = (val, type) => `
                <label class="flex items-center group cursor-pointer text-sm font-semibold text-gray-600 hover:text-red-600 transition-colors">
                    <input type="checkbox" value="${val}" data-type="${type}" class="filter-input w-4 h-4 rounded border-gray-300 text-red-600 focus:ring-red-500 mr-3 transition-all">
                    ${val}
                </label>
            `;

            document.getElementById('categoryFilters').innerHTML = categories.map(c => createCheckbox(c, 'category')).join('');
            document.getElementById('sizeFilters').innerHTML = sizes.map(s => createCheckbox(s, 'max_size')).join('');
            document.getElementById('connectivityFilters').innerHTML = connections.map(c => createCheckbox(c, 'connectivity')).join('');

            // Add Event Listeners to new inputs
            document.querySelectorAll('.filter-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const type = e.target.dataset.type;
                    const val = e.target.value;
                    if (e.target.checked) {
                        activeFilters[type].push(val);
                    } else {
                        activeFilters[type] = activeFilters[type].filter(v => v !== val);
                    }
                    renderProducts();
                });
            });
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const noRes = document.getElementById('noResults');

            const filtered = allProducts.filter(p => {
                const catMatch = activeFilters.category.length === 0 || activeFilters.category.includes(p.category);
                const sizeMatch = activeFilters.max_size.length === 0 || activeFilters.max_size.includes(p.specs.max_size);
                const connMatch = activeFilters.connectivity.length === 0 || activeFilters.connectivity.some(c => p.specs.connectivity.includes(c));
                
                return catMatch && sizeMatch && connMatch;
            });

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                noRes.classList.remove('hidden');
            } else {
                grid.classList.remove('hidden');
                noRes.classList.add('hidden');
                
                grid.innerHTML = filtered.map(p => `
                    <div onclick="openModal('${p.sku}')" class="product-card glass-panel p-8 rounded-[2.5rem] flex flex-col items-center text-center border-2 border-transparent cursor-pointer group h-full">
                        <div class="h-36 w-full mb-6 flex items-center justify-center">
                            <img src="${p.assets.image}" alt="${p.model}" class="max-h-full object-contain group-hover:scale-105 transition-transform duration-500">
                        </div>
                        <div class="mb-4">
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">${p.category}</p>
                            <h3 class="text-xl font-black text-gray-900 leading-tight">${p.model}</h3>
                        </div>
                        <div class="mt-auto w-full pt-6 border-t border-gray-100">
                             <div class="flex justify-between items-center text-[10px] font-bold uppercase text-gray-400 mb-1">
                                <span>Speed</span>
                                <span class="text-gray-900">${p.specs.speed}</span>
                             </div>
                             <div class="flex justify-between items-center text-[10px] font-bold uppercase text-gray-400">
                                <span>Max Size</span>
                                <span class="text-gray-900">${p.specs.max_size}</span>
                             </div>
                             <div class="mt-6 flex items-center justify-center text-[10px] font-black uppercase text-red-600 tracking-widest group-hover:gap-2 transition-all">
                                View Specs
                                <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                             </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function openModal(sku) {
            const p = allProducts.find(x => x.sku === sku);
            if (!p) return;
            const modal = document.getElementById('productModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <div class="flex flex-col lg:flex-row gap-12 items-center lg:items-start text-left">
                    <div class="w-full lg:w-2/5">
                        <div class="bg-gray-50 rounded-3xl p-8 flex items-center justify-center border border-gray-100">
                            <img src="${p.assets.image}" class="w-full h-auto object-contain max-h-72" alt="${p.model}">
                        </div>
                        <div class="grid grid-cols-2 gap-3 mt-8">
                            <div class="bg-red-50 p-4 rounded-2xl text-center">
                                <p class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter">Speed</p>
                                <p class="text-xs font-black text-red-600 leading-none mt-1">${p.specs.speed}</p>
                            </div>
                            <div class="bg-red-50 p-4 rounded-2xl text-center">
                                <p class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter">Daily Vol</p>
                                <p class="text-xs font-black text-red-600 leading-none mt-1">${p.specs.daily_volume.toLocaleString()}</p>
                            </div>
                            <div class="bg-gray-50 p-4 rounded-2xl text-center">
                                <p class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter">Conn</p>
                                <p class="text-[10px] font-bold text-gray-900 leading-none mt-1">${p.specs.connectivity[0]}</p>
                            </div>
                            <div class="bg-gray-50 p-4 rounded-2xl text-center">
                                <p class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter">Flatbed</p>
                                <p class="text-[10px] font-bold text-gray-900 leading-none mt-1">${p.specs.flatbed_compatible ? 'Yes' : 'No'}</p>
                            </div>
                        </div>
                    </div>
                    <div class="w-full lg:w-3/5">
                        <h2 class="text-4xl font-black text-gray-900 mb-1">${p.model}</h2>
                        <p class="text-red-600 font-bold text-xs tracking-[0.3em] uppercase mb-6">SKU: ${p.sku}</p>
                        
                        <div class="bg-gray-50/50 rounded-2xl p-6 mb-8 border-l-4 border-red-600 text-sm">
                            <p class="text-gray-600 font-medium italic leading-relaxed">${p.content.en.why}</p>
                        </div>

                        <h4 class="text-[10px] font-black text-gray-900 uppercase tracking-[0.2em] mb-4">Key Advantages:</h4>
                        <ul class="space-y-3 mb-10">
                            ${p.content.en.features.map(f => `
                                <li class="flex items-start gap-3 text-sm text-gray-700 font-medium">
                                    <svg class="w-5 h-5 text-red-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                                    ${f}
                                </li>
                            `).join('')}
                        </ul>

                        <div class="flex flex-col sm:flex-row gap-4">
                            ${p.assets.brochure ? `<a href="${p.assets.brochure}" target="_blank" class="flex-1 bg-red-600 text-white text-center py-4 rounded-2xl font-bold text-sm hover:bg-black transition-all shadow-lg">Brochure (PDF)</a>` : ''}
                            ${p.assets.video ? `<a href="${p.assets.video}" target="_blank" class="flex-1 border-2 border-gray-200 text-gray-600 text-center py-4 rounded-2xl font-bold text-sm hover:bg-gray-50 flex items-center justify-center gap-2">Product Video</a>` : ''}
                        </div>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('productModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('resetFilters').addEventListener('click', () => {
            activeFilters = { category: [], connectivity: [], max_size: [] };
            document.querySelectorAll('.filter-input').forEach(i => i.checked = false);
            renderProducts();
        });

        window.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });
        document.getElementById('productModal').addEventListener('click', (e) => { if(e.target.id === 'productModal') closeModal(); });

        init();
    </script>
</body>
</html>
